<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | Panel de Control</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

    <main class="login-container">
        <form id="login-form" class="login-card">
            <h2>Acceso Administrador</h2>
            <p>Ingresá tus credenciales para gestionar el catálogo.</p>

            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ej: admin" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Ingresar al Panel</button>

            <p id="error-message" class="error-text" hidden>Usuario o contraseña incorrectos.</p>
        </form>
    </main>

    <script src="auth.js"></script>
</body>
</html>
